name: Installer tests

on:
  push:
    branches:
      - k1max-cfs-eddy-duo-2.3.5.33
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: |
          python3 -m py_compile scripts/k1max_cfs_eddy.py
          python3 -m py_compile klippy/extras/eddy_z_acquire.py
      - name: Synthetic 2.3.5.33 install / activate / rollback
        run: python3 -m unittest -v tests.test_installer
